<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <style>
        /* Скрываем контент на время перенаправления, чтобы не было "мигания" */
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a; /* Можно заменить на фон вашего сайта */
            color: #ffffff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
    </style>
</head>
<body>
    <script>
        (function() {
            // Список языков с кириллицей
            const cyrillicLanguages = [
                'ru', 'uk', 'be', 'bg', 'mk', 'sr', 
                'kk', 'ky', 'mn', 'tg', 'ab', 'os', 
                'cv', 'ce', 'ba', 'tt', 'sah'
            ];

            function getLanguage() {
                const lang = navigator.language || navigator.userLanguage || 'en';
                const langCode = lang.split('-')[0].toLowerCase();
                return cyrillicLanguages.includes(langCode) ? 'ru' : 'en';
            }

            const lang = getLanguage();
            const path = window.location.pathname;

            // Если пользователь УЖЕ на одной из страниц /ru или /en (или их подразделах) — не перенаправляем
            if (path.startsWith('/ru') || path.startsWith('/en')) {
                return;
            }

            // Исходный хост (сохраняет www.rgb.l.cd или ваш пользовательский домен GitHub)
            const origin = window.location.origin;

            // Формируем чистый адрес без .html
            const targetUrl = `${origin}/${lang}`;

            // Выполняем перенаправление с заменой в истории браузера
            window.location.replace(targetUrl);
        })();
    </script>
</body>
</html>
